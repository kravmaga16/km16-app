name: KM16 - Verification JavaScript
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier la syntaxe des modules
        run: |
          set -eu
          find . -type f \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0 | xargs -0 -r -n 1 node --check
      - name: Tester la presence du parcours de connexion administrateur
        run: node scripts/check-admin-login.mjs
      - name: Verifier la navigation mobile de l'administration
        run: node scripts/check-admin-mobile.mjs
      - name: Verifier l'optimisation de recherche
        run: node scripts/check-admin-performance.mjs
      - name: Verifier les actualisations automatiques
        run: node scripts/check-admin-refresh.mjs
      - name: Verifier le rendu groupe des fiches adherents
        run: node scripts/check-admin-render.mjs
      - name: Verifier les compteurs du tableau de bord
        run: node scripts/check-admin-kpi.mjs
      - name: Verifier les calculs financiers du tableau de bord
        run: node scripts/check-admin-finance.mjs
      - name: Verifier l'affichage des dossiers a valider
        run: node scripts/check-admin-dossiers.mjs
      - name: Installer navigateurs de test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Tester le rendu admin dans Chromium et WebKit
        run: node scripts/check-admin-browser.mjs
      - name: Preparer un paquet de previsualisation sans publication
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: km16-preview-static
          path: |
            **/*.html
            **/*.css
            **/*.js
            **/*.mjs
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.svg
            **/*.webp
            **/*.ico
            **/*.json
          if-no-files-found: error
          retention-days: 7
