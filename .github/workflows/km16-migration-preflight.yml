name: KM16 migration preflight unit tests
on:
  pull_request:
    paths:
      - 'scripts/check-migration-replay.py'
      - 'tests/test_migration_replay_preflight.py'
      - '.github/workflows/km16-migration-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run six isolated preflight tests
        run: python -m unittest discover -s tests -p 'test_migration_replay_preflight.py' -v
