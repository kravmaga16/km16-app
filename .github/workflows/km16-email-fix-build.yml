name: KM16 - Build isolated email fix
on:
  push:
    branches: ['fix/adhesion-email-20261117']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve administrator catalogue initialization
        run: python3 .maintenance/refine-email-fix.py
      - name: Check syntax and payment rules
        run: |
          node --check adhesion.mjs
          node tests/payment-console.test.mjs
      - name: Install isolated browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test customer email flow without any external calls
        run: node scripts/check-member-email.mjs
      - name: Commit tested frontend refinement to the fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adhesion.mjs
          git commit -m 'fix: retain catalogue-dependent admin setup after early session restoration'
          git push origin HEAD:fix/adhesion-email-20261117
