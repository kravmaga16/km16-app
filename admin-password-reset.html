<head>

  <title>Nouveau mot de passe administrateur · KM16</title>
  <link rel="stylesheet" href="./public-pages.css">
</head>
<body>
<main>
  <h1>Nouveau mot de passe administrateur</h1>
  <p id="password-reset-status" role="status">Vérification du lien en cours…</p>
  <form id="password-reset-form" hidden>
    <p><label>Nouveau mot de passe<br>
      <input name="password" type="password" autocomplete="new-password" minlength="12" required>
    </label></p>
    <p><label>Confirmer le nouveau mot de passe<br>
      <input name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
    </label></p>
    <p>Utilise au moins 12 caractères.</p>
    <p><button type="submit">Enregistrer le nouveau mot de passe</button></p>
  </form>
  <p><a href="./clients.html#km16-dossiers">Retour à la connexion administrateur</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="./admin-password-recovery.mjs"></script>
</body>
